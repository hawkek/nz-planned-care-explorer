name: Build and publish

# - pull request: test, run the pipeline and render the site, without
#   publishing. The rendered site is attached to the run as "site-preview".
# - push to main: test, rebuild from the data in the repo, publish.
#   To update the site each quarter, add the new Health NZ waitlist extract to
#   data/raw/health_targets_extract/<YYYY-YY-Qn>/ and push.
# - manual run: same as a push to main.
# If a data check fails, the run fails (GitHub emails the repo owner), nothing
# is published, and the last good site stays live.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - name: Unit tests
        run: Rscript tests/testthat.R

      - name: Run pipeline (stops here if a data check fails)
        run: Rscript run_pipeline.R

      - name: Render site
        run: quarto render site

      - name: Attach the rendered site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/_site
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/_site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
